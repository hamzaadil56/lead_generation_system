[project]
name = "leadgen"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
  "pydantic>=2.6", "pydantic-settings>=2.2", "httpx>=0.27",
  "tenacity>=8.2", "structlog>=24.1", "typer>=0.12", "pyyaml>=6.0",
  "firecrawl-py>=2.0", "serpapi>=0.1",
  # Declared explicitly: app/clients/firecrawl.py catches
  # requests.RequestException to tell a transport failure apart from a
  # dead target site. It was already installed transitively.
  "requests>=2.31",
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "mypy>=1.9", "import-linter>=2.0", "ruff>=0.4", "types-pyyaml"]

# setuptools' flat-layout auto-discovery sees `app/`, `config/`, and
# `alembic/` all sitting at the backend root and refuses to guess which
# are packages ("Multiple top-level packages discovered in a flat-layout").
# `config` and `alembic` are data/migrations, not importable packages --
# only `app` (and its subpackages) should ever be installed.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs; excluded from CI"]
addopts = "-m 'not live'"

# mypy is a stated global constraint ("`mypy app` must be clean"), and all
# six errors it reported were noise, not type defects: three missing
# third-party stubs and three instances of the well-known pydantic-settings
# false positive. Config only — no working code was changed to satisfy it.
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ship type information (no py.typed, no stub package
# installed). Only their imports are silenced; our own use of them is
# still checked as `Any`.
module = ["yaml", "yaml.*", "serpapi", "serpapi.*", "firecrawl", "firecrawl.*",
          "apscheduler", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# `Settings()` reads every required field from the environment/.env, which
# is the entire point of pydantic-settings, but mypy sees a dataclass-like
# __init__ and demands database_url/serper_key/firecrawl_key as arguments.
# Passing them would break the config; the error is the false positive.
module = "app.core.config"
disable_error_code = ["call-arg"]
